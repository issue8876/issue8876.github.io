services:
  - type: web
    name: maeumgil-coach-api
    runtime: node
    buildCommand: node --version
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_API_KEY
        sync: false
      - key: COACH_JOIN_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://issue8876.github.io
