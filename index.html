<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혜련의 웹페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- 메인 컨텐츠 카드 -->
    <main class="glass-card p-10 md:p-14 text-center max-w-md w-full mx-4 z-10 relative">
        <!-- 프로필 아이콘 또는 장식 (옵션) -->
        <div
            class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-indigo-300 to-purple-400 p-1 shadow-lg shadow-purple-500/30 animate-pulse">
            <div
                class="w-full h-full rounded-full bg-black/20 backdrop-blur-sm flex items-center justify-center text-white text-2xl">
                👩‍💻
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 tracking-tight text-glow">
            혜련의<br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-200 to-pink-200">웹페이지</span>
        </h1>

        <p class="text-gray-300 mb-10 text-sm font-light tracking-widest uppercase">Creative & Interactive</p>

        <!-- 네비게이션 링크 -->
        <div class="flex flex-col gap-4">
            <a href="pages/maeumgil.html"
                class="glass-btn group rounded-xl p-4 flex items-center justify-between text-white hover:text-white no-underline">
                <div class="flex items-center gap-3">
                    <span class="bg-emerald-500/30 p-2 rounded-lg">🌱</span>
                    <span class="font-medium text-lg">마음쉼</span>
                </div>
                <span aria-hidden="true">↗</span>
            </a>
            <a href="pages/deeplearning.html"
                class="glass-btn group rounded-xl p-4 flex items-center justify-between text-white hover:text-white no-underline">
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-500/30 p-2 rounded-lg group-hover:bg-indigo-500 transition-colors">🎮</span>
                    <span class="font-medium text-lg">딥러닝 게임</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-gray-400 group-hover:text-white group-hover:translate-x-1 transition-all"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <a href="pages/seatingarrangement.html"
                class="glass-btn group rounded-xl p-4 flex items-center justify-between text-white hover:text-white no-underline">
                <div class="flex items-center gap-3">
                    <span class="bg-pink-500/30 p-2 rounded-lg group-hover:bg-pink-500 transition-colors">🏫</span>
                    <span class="font-medium text-lg">자리 배치</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-gray-400 group-hover:text-white group-hover:translate-x-1 transition-all"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <a href="pages/englishword.html"
                class="glass-btn group rounded-xl p-4 flex items-center justify-between text-white hover:text-white no-underline">
                <div class="flex items-center gap-3">
                    <span
                        class="bg-emerald-500/30 p-2 rounded-lg group-hover:bg-emerald-500 transition-colors">🔤</span>
                    <span class="font-medium text-lg">영어 단어 게임</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-gray-400 group-hover:text-white group-hover:translate-x-1 transition-all"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>
        </div>

        <footer class="mt-10 text-xs text-gray-400">
            © 2024 Hyeryeon. All rights reserved.
        </footer>
    </main>

    <script src="js/common.js"></script>
</body>

</html>
